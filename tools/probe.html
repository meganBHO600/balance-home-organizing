<!DOCTYPE html><html><head><meta charset="utf-8"><title>overflow probe</title></head>
<body><iframe id="f" style="width:390px;height:1200px;border:0"></iframe><pre id="out">pending</pre>
<script>
var page = new URLSearchParams(location.search).get('p') || 'index.html';
var f = document.getElementById('f'); f.src = page;
f.onload = function () {
  var d = f.contentDocument, w = 390, lines = ['viewport=' + w + ' scrollWidth=' + d.documentElement.scrollWidth];
  d.querySelectorAll('*').forEach(function (el) {
    var r = el.getBoundingClientRect();
    if (r.right > w + 1 || r.left < -1) lines.push(Math.round(r.left) + '..' + Math.round(r.right) + '  ' + el.tagName.toLowerCase() + (typeof el.className === 'string' && el.className ? '.' + el.className.trim().split(/\s+/).join('.') : ''));
  });
  document.getElementById('out').textContent = lines.slice(0, 40).join('\n');
};
</script></body></html>
